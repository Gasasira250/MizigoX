services:
  postgres:
    image: postgres:16-alpine
    container_name: mizigox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mizigox
      POSTGRES_USER: mizigox
      POSTGRES_PASSWORD: mizigox
    ports:
      - '5433:5432'
    volumes:
      - mizigox_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mizigox -d mizigox']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mizigox_pg_data:
