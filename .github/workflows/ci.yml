name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mizigox
          POSTGRES_USER: mizigox
          POSTGRES_PASSWORD: mizigox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mizigox -d mizigox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://mizigox:mizigox@localhost:5432/mizigox
      DATABASE_SSL: 'false'
      JWT_ACCESS_SECRET: ci-test-only-secret-not-for-production-use-32ch
      JWT_ACCESS_TTL_SECONDS: '900'
      REFRESH_TOKEN_TTL_DAYS: '7'
      COOKIE_SECURE: 'false'
      COOKIE_SAMESITE: lax
      SEED_ADMIN_EMAIL: admin@mizigox.local
      SEED_ADMIN_PASSWORD: CiAdminPassword1!
      SEED_ADMIN_FIRST_NAME: Platform
      SEED_ADMIN_LAST_NAME: Admin
      SEED_ON_BOOT: 'true'
      MIGRATE_ON_BOOT: 'true'
      LOG_LEVEL: warn
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: var/storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true
